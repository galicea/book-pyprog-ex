<h3>Wyrażenia <strong>for</strong></h3>
<p><strong>Przykład 12.9</strong><em>:</em> ex_for</p>
<div class="brython-box">
    <textarea id="code-1" class="brython-code" rows="6">
print([n ** 2 for n in range(10)])
# Możemy to łączyć z wyrażeniami if.
# Na przykład kwadraty liczb nieparzystych:
print([n ** 2 for n in range(10) if n % 2])</textarea>
    <br><button class="run-btn" data-idx="1">▶ Uruchom kod</button>
    <pre id="output-1" class="brython-output"></pre>
</div>

<p><strong>Objaśnienie:</strong></p>
<blockquote>
<p>Wyrażenia for stosuje się do generowania list. </p>
<p>Jeśli wyrażenie jest zbyt złożone - lepiej użyć zwykłej pętli lub zdefiniować funkcję generującą.</p>
</blockquote>

<p><strong>Przykład 12.10</strong><em>:</em> warcaby1 </p>
<div class="brython-box">
    <textarea id="code-5" class="brython-code" rows="16">
# 6 przypadkowych ruchów pionka na szachownicy warcabów
#
import random
kierunek=[ random.choice([-1,1]) for i in range(6) ]
wspolrzedne=[]
x=2
for y in range(6):
  if (x + kierunek[y]) == 0:
    x = 2
  elif (x + kierunek[y] > 8):
    x = 7
  else:
    x += kierunek[y]
  wspolrzedne.append([x,y+2])
print(wspolrzedne)
</textarea>
    <br><button class="run-btn" data-idx="5">▶ Uruchom kod</button>
    <pre id="output-5" class="brython-output"></pre>
</div>

    <script type="text/python">
        from browser import document
        import sys

        # Wspólna przestrzeń nazw dla całej strony (zmienne przeżywają między okienkami)
        page_namespace = {}

        def run_code(ev):
            idx = ev.target.attrs["data-idx"]
            out_element = document[f"output-{idx}"]
            out_element.text = ""
            
            class Pisarz:
                def write(self, data):
                    out_element.text += str(data)
                def flush(self): pass
            
            sys.stdout = Pisarz()
            sys.stderr = Pisarz()
            
            kod = document[f"code-{idx}"].value
            try:
                exec(kod, page_namespace)
            except Exception as e:
                print("BŁĄD:", e)

        # Przypisanie zdarzeń do wszystkich przycisków na stronie
        for btn in document.select(".run-btn"):
            btn.bind("click", run_code)
    </script>
