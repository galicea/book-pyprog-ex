<h3>Logiczna wartość różnych danych</h3>
<p><strong>Przykład 12.7</strong><em>:</em> o_bool</p>
<div class="brython-box">
    <textarea id="code-4" class="brython-code" rows="20">
class Test(object):
# to zadziała zarówno z Python2x jak i Python 3#
    def __init__(self, value):
        self.value = value

    def __bool__(self):
        return False

    def __nonzero__(self):
        return self.__bool__()

class Queue(object):
    def __init__(self, iterable):
        self.queue = iterable
    def __len__(self):
        return len(self.queue)

print(bool(Test(0)))
print(bool(Queue([])))
print(bool(Queue([1,3,2])))</textarea>
    <br><button class="run-btn" data-idx="4">▶ Uruchom kod</button>
    <pre id="output-4" class="brython-output"></pre>
</div>

<p>Objaśnienie:</p>
<blockquote>Obiekt klasy Test zawsze zwraca False. 
    Ustala tą wartość metoda <strong>bool</strong> lub <strong>nonzero</strong>. 
    Natomiast wartość obiektu klasy Queue zależy od tego, czy zainicjowano go z pustą listą.
</blockquote>
    <script type="text/python">
        from browser import document
        import sys

        # Wspólna przestrzeń nazw dla całej strony (zmienne przeżywają między okienkami)
        page_namespace = {}

        def run_code(ev):
            idx = ev.target.attrs["data-idx"]
            out_element = document[f"output-{idx}"]
            out_element.text = ""
            
            class Pisarz:
                def write(self, data):
                    out_element.text += str(data)
                def flush(self): pass
            
            sys.stdout = Pisarz()
            sys.stderr = Pisarz()
            
            kod = document[f"code-{idx}"].value
            try:
                exec(kod, page_namespace)
            except Exception as e:
                print("BŁĄD:", e)

        # Przypisanie zdarzeń do wszystkich przycisków na stronie
        for btn in document.select(".run-btn"):
            btn.bind("click", run_code)
    </script>
