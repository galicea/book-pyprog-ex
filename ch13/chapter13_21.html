<h3>Definie własnych obiektów i metod</h3>
<p><strong>Przykład 12.19:</strong> attribs</p>
<div class="brython-box">
    <textarea id="code-1" class="brython-code" rows="40">
class User1:
  def __init__(self,ident):
    self.ident = ident
    self.attr = {}

class User2:
  def __init__(self,ident):
    self.ident = ident
    self.name = ''

class User3:
# getter/setter convention
  def __init__(self,ident):
    self.ident = ident

  def setName(self,name):
    self._name = name

  def getName(self):
    return self._name

class User4(object):
# z uzyciem dekoratorow
# https://docs.python.org/2/library/functions.html#property
  def __init__(self,ident):
    self.ident = ident

  @property
  def name(self):
        return self._name

  @name.setter
  def name(self, value):
      self._name = value


u1=User1('pierwszy')
u2=User2('drugi')
u3=User3('trzeci')
u4=User4('czwarty')

u1.attr['name']='Nazwa1'
u2.name='Nazwa2'
u3.setName('Nazwa3')
u4.name='Nazwa4'
print(u1.attr['name'])
print(u2.name)
print(u3.getName())
print(u4.name)</textarea>
    <br><button class="run-btn" data-idx="1">▶ Uruchom kod</button>
    <pre id="output-1" class="brython-output"></pre>
</div>

    <script type="text/python">
        from browser import document
        import sys

        # Wspólna przestrzeń nazw dla całej strony (zmienne przeżywają między okienkami)
        page_namespace = {}

        def run_code(ev):
            idx = ev.target.attrs["data-idx"]
            out_element = document[f"output-{idx}"]
            out_element.text = ""
            
            class Pisarz:
                def write(self, data):
                    out_element.text += str(data)
                def flush(self): pass
            
            sys.stdout = Pisarz()
            sys.stderr = Pisarz()
            
            kod = document[f"code-{idx}"].value
            try:
                exec(kod, page_namespace)
            except Exception as e:
                print("BŁĄD:", e)

        # Przypisanie zdarzeń do wszystkich przycisków na stronie
        for btn in document.select(".run-btn"):
            btn.bind("click", run_code)
    </script>
