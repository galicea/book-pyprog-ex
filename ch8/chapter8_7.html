<h2>Zmienna ilość parametrów</h2>
<p><strong>Przykład 7.7</strong><em>:</em> f_variant</p>
<div class="brython-box">
    <textarea id="code-1" class="brython-code" rows="8">
def f(*par,**kpar):
    print(par)
    print(kpar)

f(1,2,4)
f('1',a=2,b=3)</textarea>
    <br><button class="run-btn" data-idx="1">▶ Uruchom kod</button>
    <pre id="output-1" class="brython-output"></pre>
</div>

<p><strong>Objaśnienie</strong>:</p>
<blockquote>W pierwszym wywołaniu uzyskaliśmy krotkę trzech wartości. W drugim mamy argumenty z nazwą – więc zostały one umieszczone w strukturze słownika. Tylko pierwszy argument jest przekazany w formie krotki.</blockquote>
    <script type="text/python">
        from browser import document
        import sys

        # Wspólna przestrzeń nazw dla całej strony (zmienne przeżywają między okienkami)
        page_namespace = {}

        def run_code(ev):
            idx = ev.target.attrs["data-idx"]
            out_element = document[f"output-{idx}"]
            out_element.text = ""
            
            class Pisarz:
                def write(self, data):
                    out_element.text += str(data)
                def flush(self): pass
            
            sys.stdout = Pisarz()
            sys.stderr = Pisarz()
            
            kod = document[f"code-{idx}"].value
            try:
                exec(kod, page_namespace)
            except Exception as e:
                print("BŁĄD:", e)

        # Przypisanie zdarzeń do wszystkich przycisków na stronie
        for btn in document.select(".run-btn"):
            btn.bind("click", run_code)
    </script>
