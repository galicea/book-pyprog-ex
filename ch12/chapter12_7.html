# -*- coding: utf-8 -*-
class BlednyKodPocztowy(Exception):

    def __init__(self, msg):
        Exception.__init__(self)
        print(5)
        self.msg = msg

class KodPocztowy():
    wartosc = '00-000'

    def set(self,kod):
        print(3)
        if (len(kod)!=6) or (kod[2]!='-'):
            print(4)
            raise BlednyKodPocztowy('Poprawny format kodu: 99-999')
        print('Tu tylko gdy poprawny kod')
        self.wartosc=kod

kod=KodPocztowy()
print(1)
try:
    print(2)
    kod.set('22-22')
    print('Tu tylko gdy poprawny kod')
except BlednyKodPocztowy as e:
    print(e.msg)
    print(6)
print(7)</textarea>

<p><strong>Objaśnienie</strong></p>
<bloackquote>Uzyskany wynik potwierdza, że w programie prawidłowo przewidziano przepływ sterowania oraz miejsca ominięte w razie błędu danych.</bloackquote>
    <script type="text/python">
        from browser import document
        import sys

        # Wspólna przestrzeń nazw dla całej strony (zmienne przeżywają między okienkami)
        page_namespace = {}

        def run_code(ev):
            idx = ev.target.attrs["data-idx"]
            out_element = document[f"output-{idx}"]
            out_element.text = ""
            
            class Pisarz:
                def write(self, data):
                    out_element.text += str(data)
                def flush(self): pass
            
            sys.stdout = Pisarz()
            sys.stderr = Pisarz()
            
            kod = document[f"code-{idx}"].value
            try:
                exec(kod, page_namespace)
            except Exception as e:
                print("BŁĄD:", e)

        # Przypisanie zdarzeń do wszystkich przycisków na stronie
        for btn in document.select(".run-btn"):
            btn.bind("click", run_code)
    </script>
