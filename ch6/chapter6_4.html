#encoding: UTF-8

class TSzyfrant:

    def __init__(self,klucz):
        self.klucz=klucz

    def szyfruj(self, liczba):
        return (liczba + self.klucz) % 256

    def odszyfruj(self, liczba):
        return (256 + liczba - self.klucz) % 256

class TSolitaire(TSzyfrant):

    def s_szyfruj(self, napis):
        wynik=[]
        for znak in napis:
            wynik.append(self.szyfruj(ord(znak)))
        return wynik

    def s_odszyfruj(self, zakodowany):
        wynik=''
        for kod in zakodowany:
            wynik= wynik+chr(self.odszyfruj(kod))
        return wynik

szyfrant=TSolitaire(88)
wiadomosc = input('Podaj napis: ')
szyfr=szyfrant.s_szyfruj(wiadomosc)
print('Wynik=%s' % szyfr)
print('Deszyfr=%s' % szyfrant.s_odszyfruj(szyfr))
</textarea>
    <br><button class="run-btn" data-idx="1">▶ Uruchom kod</button>

</div>

<p>Klasa TSolitaire dziedziczy z klasy TSzyfrant metody kodowania liczb i wykorzystuje je do kodowania łańcuchów znaków.</p>
    <script type="text/python">
        from browser import document
        import sys

        # Wspólna przestrzeń nazw dla całej strony (zmienne przeżywają między okienkami)
        page_namespace = {}

        def run_code(ev):
            idx = ev.target.attrs["data-idx"]
            out_element = document[f"output-{idx}"]
            out_element.text = ""
            
            class Pisarz:
                def write(self, data):
                    out_element.text += str(data)
                def flush(self): pass
            
            sys.stdout = Pisarz()
            sys.stderr = Pisarz()
            
            kod = document[f"code-{idx}"].value
            try:
                exec(kod, page_namespace)
            except Exception as e:
                print("BŁĄD:", e)

        # Przypisanie zdarzeń do wszystkich przycisków na stronie
        for btn in document.select(".run-btn"):
            btn.bind("click", run_code)
    </script>
