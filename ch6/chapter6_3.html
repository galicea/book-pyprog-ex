<body onload="brython()">
    <a href="../index.html" class="nav-link">⬅ Wróć do spisu treści</a>

<h2>Moduły</h2>
<p><strong>Przykład 5.4</strong><em>:</em> cipher.py</p>
<div class="jobe-box">
    <textarea id="jobe-module" class="jobe-code" rows="12">
class TSzyfrant:

    def __init__(self,klucz):
        self.klucz=klucz

    def szyfruj(self, liczba):
        return (liczba + self.klucz) % 256

    def odszyfruj(self, liczba):
        return (256 + liczba - self.klucz) % 256</textarea>
</div>

<p><strong>Przykład 5.4 c.d</strong><em>.:</em> cipher.py</p>
<div class="jobe-box">
    <textarea id="jobe-main" class="jobe-code" rows="10">
#encoding: UTF-8
from cipher import TSzyfrant

szyfrant=TSzyfrant(89)
wiadomosc = int(input('Podaj dodatnią liczbę do zaszyfrowania: '))
szyfr=szyfrant.szyfruj(wiadomosc)
print('Wynik=%s' % szyfr)
print('Odszyfrowany: %s' % szyfrant.odszyfruj(szyfr))</textarea>
    <br /><textarea id="jobe-input" rows="2">150</textarea><br /><button class="run-btn" onclick="runJobeMultiFile()">▶ Uruchom kod</button>
    
    <pre id="jobe-output" class="output-box">Oczekuję na uruchomienie...</pre>
</div>
    

    <script>
// Funkcja pomocnicza do kodowania UTF-8 do Base64
        function utf8ToBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        async function runJobeMultiFile() {
            const moduleCode = document.getElementById('jobe-module').value;
            const mainCode = document.getElementById('jobe-main').value;
            const inputData = document.getElementById('jobe-input').value;
            const outputEl = document.getElementById('jobe-output');
            
            outputEl.innerText = "Komunikacja z serwerem Jobe...";
            
            const jobeApiUrl = 'https://jobe.otwartaedukacja.pl/jobe/index.php/restapi/runs';

            // Wstrzyknięcie kodu tworzącego moduł przed głównym skryptem czytelnika
            const injectedCode = `import base64
with open('cipher.py', 'w', encoding='utf-8') as f:
    f.write(base64.b64decode('${utf8ToBase64(moduleCode)}').decode('utf-8'))

${mainCode}`;

            // Wysyłamy TYLKO pole sourcecode i input (bez kapryśnego file_list)
            const payload = {
                run_spec: {
                    language_id: "python3",
                    sourcecode: injectedCode,
                    input: inputData
                }
            };

            try {
                const response = await fetch(jobeApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.cmpinfo) {
                    outputEl.innerText = "BŁĄD KOMPILACJI:\n" + result.cmpinfo;
                } else if (result.stderr) {
                    outputEl.innerText = "BŁĄD WYKONANIA:\n" + result.stderr;
                } else {
                    outputEl.innerText = result.stdout || "Brak danych na standardowym wyjściu.";
                }
                
            } catch (error) {
                outputEl.innerText = "Błąd połączenia z serwerem Jobe:\n" + error.message;
            }
        }
    </script>
</body>
